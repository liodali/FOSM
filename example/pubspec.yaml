name: example
description: Interactive demo app for the FOSM map library.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.14.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  fosm:
    path: ../
  forui: ^0.28.0
  material_ui: ^1.11.1
  routing_client_dart: ^1.0.8
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - benchmark/native_comparison.json
